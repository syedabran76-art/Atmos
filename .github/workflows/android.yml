name: ATMOS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ATMOS APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Build Debug APK with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"

            if gradle assembleDebug --no-daemon; then
              echo "Build successful"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed. Waiting before retry..."
              sleep $((attempt * 20))
            fi
          done

          echo "Build failed after 3 attempts."
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATMOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
